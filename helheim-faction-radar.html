<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Helheim Faction-Radar</title>
<style>
  body {
    margin: 0;
    padding: 24px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #ffffff;
    color: #1a1a1a;
  }
  h1 {
    font-size: 18px;
    font-weight: 500;
    margin: 0 0 20px;
  }
  .controls {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 16px;
    margin-bottom: 24px;
  }
  .control label {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    color: #555;
    margin-bottom: 4px;
  }
  .control input[type="range"] {
    width: 100%;
  }
  .chart-wrap {
    position: relative;
    width: 100%;
    max-width: 600px;
    height: 380px;
    margin: 0 auto;
  }
</style>
</head>
<body>

<h1>Helheim – Faction-Sympathie (Radarwert)</h1>

<div class="controls">
  <div class="control">
    <label><span>Verlorene</span><span id="v-out">3</span></label>
    <input type="range" min="-10" max="10" step="1" value="3" id="v">
  </div>
  <div class="control">
    <label><span>Suchende</span><span id="s-out">3</span></label>
    <input type="range" min="-10" max="10" step="1" value="3" id="s">
  </div>
  <div class="control">
    <label><span>Sammler</span><span id="sa-out">-1</span></label>
    <input type="range" min="-10" max="10" step="1" value="-1" id="sa">
  </div>
  <div class="control">
    <label><span>Verharrende</span><span id="ve-out">-3</span></label>
    <input type="range" min="-10" max="10" step="1" value="-3" id="ve">
  </div>
  <div class="control">
    <label><span>Prediger</span><span id="p-out">1</span></label>
    <input type="range" min="-10" max="10" step="1" value="1" id="p">
  </div>
</div>

<div class="chart-wrap">
  <canvas id="radarChart" role="img" aria-label="Radar-Chart der Faction-Sympathiewerte">Sympathiewerte je Faction von -10 bis 10</canvas>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
const ids = ['v','s','sa','ve','p'];
const labels = ['Verlorene','Suchende','Sammler','Verharrende','Prediger'];
const outs = ids.map(id => document.getElementById(id + '-out'));
const inputs = ids.map(id => document.getElementById(id));

const STORAGE_KEY = 'helheim-faction-radar-values';

// Gespeicherte Werte laden, falls vorhanden
try {
  const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
  if (saved && Array.isArray(saved) && saved.length === ids.length) {
    inputs.forEach((input, idx) => {
      input.value = saved[idx];
      outs[idx].textContent = saved[idx];
    });
  }
} catch (e) {
  console.warn('Konnte gespeicherte Werte nicht laden:', e);
}

const ctx = document.getElementById('radarChart');
const chart = new Chart(ctx, {
  type: 'radar',
  data: {
    labels: labels,
    datasets: [{
      label: 'Sympathie',
      data: inputs.map(i => Number(i.value)),
      backgroundColor: 'rgba(42,120,214,0.15)',
      borderColor: '#2a78d6',
      borderWidth: 2,
      pointBackgroundColor: '#2a78d6',
      pointRadius: 4
    }]
  },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    scales: {
      r: {
        min: -10,
        max: 10,
        ticks: { stepSize: 5, showLabelBackdrop: false, color: '#898781' },
        grid: { color: '#e1e0d9' },
        angleLines: { color: '#e1e0d9' },
        pointLabels: { color: '#52514e', font: { size: 13 } }
      }
    },
    plugins: { legend: { display: false } }
  }
});

inputs.forEach((input, idx) => {
  input.addEventListener('input', () => {
    outs[idx].textContent = input.value;
    chart.data.datasets[0].data[idx] = Number(input.value);
    chart.update();
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(inputs.map(i => Number(i.value))));
    } catch (e) {
      console.warn('Konnte Werte nicht speichern:', e);
    }
  });
});
</script>

</body>
</html>
